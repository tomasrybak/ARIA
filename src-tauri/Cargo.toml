[package]
name = "aria"
version = "0.3.0"
description = "ARIA — cross-platform desktop HUD dashboard"
authors = ["Tern04"]
edition = "2021"

[lib]
# _lib suffix avoids name collision with the bin on Windows (rust-lang/cargo#8519)
name = "aria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for transparent windows on macOS
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
# Native file picker for the custom wallpaper (see src/wallpaper.rs).
tauri-plugin-dialog = "2"
# Command bar hotkey (macOS, Windows, X11) and `aria --command` for Wayland,
# where apps get no global hotkeys (see src/palette.rs). Held at the last
# releases that build on tauri 2.11; newer ones pull a tauri upgrade along.
tauri-plugin-global-shortcut = "~2.3"
tauri-plugin-single-instance = "~2.4"
# Loopback-only media server for video wallpapers. WebKitGTK's media player
# cannot load wry's custom `asset:` scheme and mis-plays blob: URLs (readyState
# 4, currentTime frozen at 0); it works over HTTP with byte ranges, which is
# also the only way to play a large file without buffering it in memory.
tiny_http = "0.12"
# Real PTYs for the TERMINAL widget (Unix openpty / Windows ConPTY). A pipe
# would not do: sudo, apt and every TUI need a controlling terminal.
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.36"
tokio = { version = "1", features = ["time", "sync", "macros", "net", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Discord gateway websocket; rustls to share the TLS stack with reqwest.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
imap = "2"
# same minor as imap 2.4's internal dep; needed to name Envelope in signatures
imap-proto = "0.10"
native-tls = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rfc2047-decoder = "1"
chrono = "0.4"
# Linux only: encode the desktop wallpaper as a data: URI for the opaque-window
# transparency workaround (see window::desktop_background).
base64 = "0.22"
# Passphrase-encrypted settings export (see src/settings.rs).
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",    # desktop-layer z-order pinning
    "Win32_UI_Shell",                  # SetWindowSubclass (bottom clamp)
    "Win32_UI_Input_KeyboardAndMouse", # Alt-key gate, idle time
    "Win32_System_SystemInformation",  # GetTickCount
    "Win32_System_Threading",          # foreground process name
    "Win32_System_Performance",        # PDH GPU counters
    "Win32_System_Registry",           # Steam install path
    "Media_Control",                   # SMTC now-playing (WinRT)
    "Storage_Streams",                 # SMTC thumbnail stream (album art)
    "Win32_Media_Audio",               # default output device (volume)
    "Win32_Media_Audio_Endpoints",     # IAudioEndpointVolume
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", # IMMDevice::Activate's signature
    "Win32_System_Variant",
] }

# Linux only: a tiny Wayland client for the screen-time tracker — cosmic-comp
# exposes the focused window (cosmic-toplevel-info) and idle state
# (ext-idle-notify) only over Wayland, with no CLI/D-Bus equivalent. Bindings
# are generated at build time from the vendored, permissively-licensed protocol
# XML under `protocols/` (see collectors::screentime), so no GPL cosmic crate is
# pulled into this MIT project.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
# X11 sessions (GNOME/Xorg and any other X11 WM): the focused window comes from
# _NET_ACTIVE_WINDOW and idle time from MIT-SCREEN-SAVER. Pure Rust, so no
# libX11/libxcb link dependency (see collectors::screentime::x11).
x11rb = { version = "0.13", features = ["screensaver"] }
# Same version tauri links. Only for putting the window on a chosen monitor
# under Wayland, which has no client position API (window::place_on_monitor).
gtk = "0.18"
# GNOME's session bus: Mutter's idle monitor (the only idle source on a GNOME
# Wayland session — it advertises no ext-idle-notify) and the screensaver's
# lock state. Same version the keyring's secret-service backend already links.
dbus = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Machine-bound key for the macOS dev-mode secrets file (the cipher itself is
# a general dependency).
sha2 = "0.10"

# Unoptimised Argon2 turns a 0.25 s export into many seconds under `tauri dev`.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
